name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System libraries for PDF rendering
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - name: Public-repo guard (large files, secrets, restricted data)
        run: python scripts/precommit_guard.py --tracked
      - run: pytest -q
        env:
          DEMO_MODE: "1"
